[package]
name = "sidevoice-voice"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
# Shipped through git tags and the npm package, never crates.io.
publish = false
license = "Apache-2.0"
repository = "https://github.com/sidevoice/sidevoice-voice"
description = "Sidevoice voice: the call on the device, from the microphone to turns and from replies to the speaker"

[lib]
# cdylib: the wasm32 build that becomes the npm package. Native consumers depend on the crate as source and get the
# rlib.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The models' bridges are async traits (src/models.rs), Send natively and not in the wasm32 build, as the engine's.
async-trait = "=0.1.92"
# The call's task takes every message on one channel and waits for it or the state machine's next deadline
# (src/voice_call.rs): runtime-free, so the same on Tokio and in the browser.
futures-channel = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# The room's messages and the configuration, read and written as JSON (src/room.rs, src/config.rs).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Which platform code a build contains is decided by these tables and one `#![cfg]` per platform file, which must
# agree.

# The web build (the npm package): the browser's event loop, timers and clocks (src/runtime/web.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

# Every native build:
# - the engine crate itself (src/models/engine.rs), and the app's Tokio runtime, on which the call runs its tasks and
#   timers (src/runtime/native.rs). The engine is pinned to the head of sidevoice-engine#71 (`vad`, and loaded
#   models whose futures are Send natively) until a release carries it; then to that release's tag.
# - the device's microphone and speaker (src/io/native.rs). cpal opens the system's default devices
#   (ALSA on Linux, which needs its development files to build; Core Audio on macOS), and their callbacks only move
#   samples through rtrb's lock-free rings. WebRTC's audio processing cancels the echo (src/echo/native.rs), its C++
#   built by the crate's own `bundled` switch (meson, ninja, pkg-config and a C++ compiler; libclang for bindgen),
#   pinned exactly. It does not build on Windows yet.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "=0.18.2"
rtrb = "=0.4.0"
webrtc-audio-processing = { version = "=2.1.0", features = ["bundled"] }
sidevoice-engine = { git = "https://github.com/sidevoice/sidevoice-engine", rev = "30fb5b0dfb13e6af9f58528c4593afe4bcbeb2e6" }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

[build-dependencies]
cfg_aliases = "0.2.2"
