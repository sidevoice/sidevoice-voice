name: Set up the Rust build
description: >-
  Installs the pinned Rust toolchain (with rustfmt and Clippy) and restores the build cache. With `wasm: true`, also
  the wasm32 target.

inputs:
  wasm:
    description: Whether to set up the wasm32 build too.
    default: "false"

runs:
  using: composite
  steps:
    - name: Toolchain
      shell: bash
      env:
        RUST_VERSION: "1.98.1"
        WASM: ${{ inputs.wasm }}
      run: |
        set -euo pipefail
        rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
        if [ "$WASM" = true ]; then rustup target add --toolchain "$RUST_VERSION" wasm32-unknown-unknown; fi
        echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.wasm == 'true' && 'wasm' || '' }}
