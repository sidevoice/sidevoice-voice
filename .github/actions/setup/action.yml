name: Set up the Rust build
description: >-
  Installs the pinned Rust toolchain (with rustfmt and Clippy) and the native build's system tools (meson, ninja,
  pkg-config, and ALSA on Linux), and restores the build cache. With `wasm: true`, also the wasm32 target and the
  wasm-bindgen CLI (`wasm-bindgen`, and `wasm-bindgen-test-runner`, the wasm32 tests' runner in .cargo/config.toml).

inputs:
  wasm:
    description: Whether to set up the wasm32 build too.
    default: "false"

runs:
  using: composite
  steps:
    - name: Toolchain
      shell: bash
      env:
        RUST_VERSION: "1.98.1"
        WASM: ${{ inputs.wasm }}
      run: |
        set -euo pipefail
        rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
        if [ "$WASM" = true ]; then rustup target add --toolchain "$RUST_VERSION" wasm32-unknown-unknown; fi
        echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
    # The native build's system tools: WebRTC's audio processing builds its C++ with meson and ninja (the
    # `bundled` switch of webrtc-audio-processing), and cpal links ALSA on Linux. CMake, a C++ compiler and libclang
    # (whisper.cpp, through the engine) are on the runners already.
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq meson ninja-build pkg-config libasound2-dev
    - if: runner.os == 'macOS'
      shell: bash
      run: brew install meson ninja pkg-config
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.wasm == 'true' && 'wasm' || '' }}
    # The CLI must be the version of the `wasm-bindgen` crate in Cargo.lock: bump both together. install-action
    # checks the release binary against the SHA-256 in its own manifest; no fallback to building it from source.
    # After the cache, so that no binary the cache restores stands in for this one.
    - if: inputs.wasm == 'true'
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: wasm-bindgen@0.2.129
        fallback: none
