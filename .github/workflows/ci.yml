name: ci

# Every pull request: format and Clippy (native and wasm32, and the build tooling), the crate built and linked for iOS
# and Android (`cargo xtask mobile-build`), the tests on macOS, Linux, Windows and on wasm32 in Node (the call on recorded speech, with fake models; real models run in the apps' CI, which wire them
# in), and the npm package `@sidevoice/voice` built and installed as a consumer installs it (`cargo xtask npm`,
# `npm-smoke`), publishing nothing: what passes here is what merging publishes (release.yml).
on:
  # Into any branch, so a pull request stacked on another is checked before its base merges.
  pull_request:
  # release-please.yml dispatches it on the release PR, whose pushes start no workflow.
  workflow_dispatch:
    inputs:
      comparison:
        description: Run the optional C++/Sonora comparison on Linux and macOS instead of product CI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.comparison || false }}
  cancel-in-progress: true

jobs:
  platform-boundary:
    name: Platform boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo xtask platform-guard

  lint:
    if: ${{ !inputs.comparison }}
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          wasm: true
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path xtask/Cargo.toml --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

  test-native:
    if: ${{ !inputs.comparison }}
    name: Test native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-15 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: windows-x86_64, runner: windows-2025 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo test --locked

  # The crate for the phones' targets, as an app compiles it in: iOS on a Mac (the iOS SDK links), Android with cargo-ndk.
  # Built and linked, not run.
  build-mobile:
    if: ${{ !inputs.comparison }}
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ios, runner: macos-15 }
          - { platform: android, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          ios: ${{ matrix.platform == 'ios' }}
          android: ${{ matrix.platform == 'android' }}
      - run: cargo xtask mobile-build ${{ matrix.platform }}

  test-wasm:
    if: ${{ !inputs.comparison }}
    name: Test wasm (Node, npm package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node --experimental-default-type=module --test js/tests/*.test.mjs
      - uses: ./.github/actions/setup
        with:
          wasm: true
      # The build tooling's own tests (xtask/), then the module's tests compiled to wasm32 and run in Node by
      # wasm-bindgen-test-runner (the runner in .cargo/config.toml; doctests cannot run on wasm32).
      - run: cargo test --locked --manifest-path xtask/Cargo.toml
      - run: cargo test --locked --target wasm32-unknown-unknown --lib
      # The npm package, installed into a temporary directory as a consumer installs it: in Node a call must load its
      # models through fakes, start a fake microphone and speaker, and say it listens (xtask/src/npm.rs).
      - run: cargo xtask npm
      - run: cargo xtask npm-smoke
      # The package this pull request builds, to try the call before it merges: one artifact per head commit,
      # `voice-npm-<head sha>`, kept 7 days. Built, as every job here, from GitHub's merge of that head into the base.
      # RELEASING.md, "A pull request's package".
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-npm-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/npm/*.tgz
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  audio-comparison:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison }}
    name: Audio comparison (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      # Only this opt-in comparison links C++; product setup remains Rust-only for processing.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential meson ninja-build pkg-config libclang-dev
      - if: runner.os == 'macOS'
        run: brew install meson ninja pkg-config llvm
      - if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - run: rustup component add llvm-tools
      - name: Validate and compare
        shell: bash
        run: cargo xtask audio-comparison | tee comparison.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio-comparison-${{ matrix.runner }}-${{ github.sha }}
          path: comparison.md
          if-no-files-found: error
