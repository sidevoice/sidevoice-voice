name: release

# Merging is publishing. Every push to main replaces the `nightly` pre-release; release-please.yml calls this with
# the vX.Y.Z tag it created. The build tooling's tests and the wasm32 tests, then `cargo xtask npm` (the npm package
# `@sidevoice/voice`, packed) and `cargo xtask npm-smoke` (installed as a consumer installs it and run in Node). Then
# `cargo xtask manifest` (SHA256SUMS), one attestation over the assets, and `cargo xtask publish` (attach, read back,
# verify, publish); for a vX.Y.Z release, `cargo xtask npm-publish` then stages it on npm for the operator to
# approve. The native tests are ci.yml's, on every PR. RELEASING.md.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: The draft vX.Y.Z release release-please created; its assets are built from that tag.
        type: string
        required: true

permissions:
  contents: read

# Never cancelled half-way. Nightlies queue behind each other (a newer one replaces a waiting one); each version
# has its own group.
concurrency:
  group: release-${{ inputs.tag || 'nightly' }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || 'nightly' }}

jobs:
  build:
    name: Build npm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: ./.github/actions/setup
        with:
          wasm: true
      - run: cargo test --locked --manifest-path xtask/Cargo.toml
      - run: cargo test --locked --target wasm32-unknown-unknown --lib
      - run: cargo xtask npm
      - run: cargo xtask npm-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: target/npm/*.tgz
          retention-days: 7
          if-no-files-found: error
      # The same package under the name a pull request's carries (ci.yml), so a commit of main is found as a PR's head
      # is: `voice-npm-<sha>`, kept 7 days. Not for a vX.Y.Z release, which is on npm.
      - if: ${{ !inputs.tag }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-npm-${{ github.sha }}
          path: target/npm/*.tgz
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: dist
      - run: cargo xtask manifest dist ${{ inputs.tag && format('--tag {0}', inputs.tag) || '' }}
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - run: cp "${{ steps.attest.outputs.bundle-path }}" dist/attestation.sigstore.json
      - run: cargo xtask publish dist "$TAG"

  # Versioned releases only, never the nightly: the npm tarball the Release just published (read back and checked
  # against SHA256SUMS and the attestation), STAGED by trusted publishing (OIDC; no token exists): the operator
  # approves it on npmjs.com. RELEASING.md.
  stage-npm:
    name: Stage on npm
    needs: publish-release
    if: inputs.tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/setup
      # Node.js 24 runs the npm CLI `cargo xtask npm-publish` pins (`npm stage`). No registry-url, so no .npmrc and no
      # token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: cargo xtask npm-publish "$TAG"
